<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<div class="container">

    <h1>🎵 Mes fichiers audio</h1>

    <p>Envoyez votre fichier audio.</p>

    <form action="upload.php" method="POST" enctype="multipart/form-data">

        <label for="audio">Choisir un fichier audio</label>

        <input
            type="file"
            id="audio"
            name="audio"
            accept="audio/*"
            required
        >

        <button type="submit">
            📤 Envoyer
        </button>

    </form>

    <a class="link" href="audios.php">
        🎧 Voir mes fichiers audio
    </a>

</div>
